<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>90 Days Fitness</title>

<style>
body {background:#0f1117;color:#fff;font-family:sans-serif;text-align:center;padding:20px}
.card {background:#1e2335;padding:20px;border-radius:16px;margin:10px}
button {padding:10px 20px;border:none;border-radius:10px;background:#3de888;color:#000;font-weight:bold}
input {padding:10px;border-radius:10px;border:none;margin:5px;width:80%}
</style>
</head>

<body>

<div id="login">
  <h2>تسجيل الدخول</h2>
  <input id="username" placeholder="اكتب اسمك" />
  <br>
  <button onclick="login()">دخول</button>
</div>

<div id="app" style="display:none">
  <h2 id="user"></h2>

  <div class="card">
    <h3 id="day">Day 1</h3>

    <select id="workout">
      <option>Push</option>
      <option>Pull</option>
      <option>Legs</option>
      <option>Walking</option>
      <option>Cardio</option>
    </select>

    <br><br>

    <button onclick="save('Done')">Done</button>
    <button onclick="save('Skip')">Skip</button>
  </div>

  <div class="card">
    <h3>السجل</h3>
    <div id="log"></div>
  </div>

  <button onclick="logout()">Logout</button>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbysJDVRV0FeI1kH52WivZ5ogI3P1cWz-AUgOWMdCn6N1TuYDEfJn-RxicF9u0PrY_4y/exec";

let user = localStorage.getItem("user");
let data = [];

if(user){
  startApp();
}

function login(){
  const u = document.getElementById("username").value.trim();
  if(!u) return alert("اكتب اسمك");
  localStorage.setItem("user", u);
  user = u;
  startApp();
}

function logout(){
  localStorage.removeItem("user");
  location.reload();
}

function startApp(){
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("user").innerText = "👤 " + user;
  load();
}

async function load(){
  const res = await fetch(SCRIPT_URL + "?username=" + user);
  data = await res.json();
  render();
}

function render(){
  const log = document.getElementById("log");
  log.innerHTML = "";

  data.forEach(e=>{
    log.innerHTML += `<p>Day ${e.day} - ${e.workout} - ${e.status}</p>`;
  });

  const next = data.length + 1;
  document.getElementById("day").innerText = "Day " + next;
}

async function save(status){
  const workout = document.getElementById("workout").value;

  const entry = {
    username: user,
    day: data.length + 1,
    workout,
    status,
    ts: new Date().toISOString()
  };

  await fetch(SCRIPT_URL, {
    method:"POST",
    body: JSON.stringify(entry)
  });

  await load();
}
</script>

</body>
</html>
