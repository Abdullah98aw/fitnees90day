<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>90 Days Fitness</title>

<style>
:root {
  --bg:#0f1117;
  --card:#1e2335;
  --text:#f5f7fa;
  --muted:#9aa3b2;
  --primary:#3de888;
  --border:rgba(255,255,255,.08);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:var(--bg);
  color:var(--text);
  max-width:420px;
  margin-inline:auto;
  padding:14px;
  line-height:1.5;
}

/* العناوين */
h2{
  font-size:18px;
  margin:8px 0;
  font-weight:700;
}

h3{
  font-size:15px;
  margin:6px 0 10px;
  font-weight:600;
  color:var(--muted);
}

/* الكروت */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  margin:10px 0;
}

/* الفورم */
input,select{
  width:100%;
  padding:10px 12px;
  font-size:14px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#181c27;
  color:var(--text);
  margin:6px 0;
}

/* الأزرار */
button{
  width:100%;
  padding:11px;
  font-size:14px;
  border-radius:10px;
  border:none;
  font-weight:600;
  background:var(--primary);
  color:#000;
  margin-top:6px;
}

button:active{
  opacity:.85;
}

/* زر ثانوي */
button.secondary{
  background:#232840;
  color:#fff;
  border:1px solid var(--border);
}

/* النصوص */
p{
  font-size:13px;
  margin:6px 0;
  color:var(--muted);
}

/* السجل */
#log p{
  background:#181c27;
  border-radius:10px;
  padding:8px;
  font-size:13px;
  margin:6px 0;
  border:1px solid var(--border);
}

/* الموبايل */
@media (max-width:420px){
  body{padding:12px}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <h2>تسجيل الدخول</h2>
  <input id="username" placeholder="اكتب اسمك" />
  <br>
  <button onclick="login()">دخول</button>
</div>

<!-- APP -->
<div id="app" style="display:none">

  <h2 id="user"></h2>

  <!-- WORKOUT -->
  <div class="card">
    <h3 id="day">Day 1</h3>

    <select id="workout">
      <option>Push</option>
      <option>Pull</option>
      <option>Legs</option>
      <option>Walking</option>
      <option>Cardio</option>
    </select>

    <br>

    <button onclick="save('Done')">Done</button>
    <button onclick="save('Skip')">Skip</button>
  </div>

  <!-- WEIGHT -->
  <div class="card">
    <h3>الوزن</h3>

    <input id="startWeight" placeholder="وزن البداية" type="number">
    <input id="goalWeight" placeholder="الهدف" type="number">
    <input id="currentWeight" placeholder="وزنك الحالي" type="number">

    <button onclick="saveWeight()">حفظ الوزن</button>

    <p id="weightInfo"></p>
  </div>

  <!-- SUMMARY -->
  <div class="card">
    <h3>الملخص</h3>
    <p id="summary"></p>
  </div>

  <!-- LOG -->
  <div class="card">
    <h3>السجل</h3>
    <div id="log"></div>
  </div>

  <button onclick="logout()">Logout</button>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbysJDVRV0FeI1kH52WivZ5ogI3P1cWz-AUgOWMdCn6N1TuYDEfJn-RxicF9u0PrY_4y/exec";

let user = localStorage.getItem("user");
let data = [];

// ===== AUTO LOGIN =====
if(user){
  startApp();
}

// ===== LOGIN =====
function login(){
  const u = document.getElementById("username").value.trim();
  if(!u) return alert("اكتب اسمك");
  localStorage.setItem("user", u);
  user = u;
  startApp();
}

// ===== LOGOUT =====
function logout(){
  localStorage.removeItem("user");
  location.reload();
}

// ===== START =====
function startApp(){
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("user").innerText = "👤 " + user;
  load();
}

// ===== LOAD DATA (no cache) =====
async function load(){
  try{
    const res = await fetch(SCRIPT_URL + "?username=" + encodeURIComponent(user) + "&_=" + Date.now(), {
      cache: "no-store"
    });
    const json = await res.json();
    data = Array.isArray(json) ? json : [];
  }catch(e){
    data = [];
  }
  render();
  renderWeight();
}

// ===== GET NEXT DAY (FIX) =====
function getNextDay(){
  if(!data.length) return 1;
  const maxDay = Math.max(...data.map(x => Number(x.day) || 0));
  return Math.min(90, maxDay + 1);
}

// ===== RENDER =====
function render(){
  const log = document.getElementById("log");
  log.innerHTML = "";

  data
    .sort((a,b)=>Number(b.day)-Number(a.day))
    .forEach(e=>{
      log.innerHTML += `<p>Day ${e.day} - ${e.workout} - ${e.status}</p>`;
    });

  document.getElementById("day").innerText = "Day " + getNextDay();

  renderSummary();
}

// ===== SAVE ENTRY =====
async function save(status){
  const workout = document.getElementById("workout").value;

  const entry = {
    username: user,
    day: getNextDay(),
    workout,
    status,
    ts: new Date().toISOString()
  };

  // optimistic UI
  data.push(entry);
  render();

  try{
    await fetch(SCRIPT_URL, {
      method:"POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(entry)
    });
  }catch(e){
    // ignore, already saved locally in UI
  }

  await load(); // re-sync
}

// ===== WEIGHT SAVE =====
function saveWeight(){
  const start = document.getElementById("startWeight").value;
  const goal = document.getElementById("goalWeight").value;
  const current = document.getElementById("currentWeight").value;

  if(start)   localStorage.setItem("start_"+user, start);
  if(goal)    localStorage.setItem("goal_"+user, goal);
  if(current) localStorage.setItem("current_"+user, current);

  renderWeight();
}

// ===== WEIGHT RENDER =====
function renderWeight(){
  const start = localStorage.getItem("start_"+user);
  const goal = localStorage.getItem("goal_"+user);
  const current = localStorage.getItem("current_"+user);

  if(!start || !current){
    document.getElementById("weightInfo").innerText = "";
    return;
  }

  const lost = (start - current).toFixed(1);
  const remain = goal ? (current - goal).toFixed(1) : "-";

  document.getElementById("weightInfo").innerText =
    `بدأت: ${start} كجم | الآن: ${current} كجم | خسرت: ${lost} كجم | المتبقي: ${remain}`;
}

// ===== SUMMARY =====
function renderSummary(){
  let done = data.filter(x=>x.status==="Done").length;
  let skip = data.filter(x=>x.status==="Skip").length;

  document.getElementById("summary").innerText =
    `Done: ${done} | Skip: ${skip}`;
}
</script>

</body>
</html>
