<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام 90 يوم</title>

<style>
body{background:#0f1117;color:#fff;font-family:sans-serif;text-align:center;padding:20px}
input,select,button{margin:5px;padding:10px;border-radius:8px;border:none}
button{background:#3de888;font-weight:bold}
.hidden{display:none}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
<h2>تسجيل الدخول</h2>
<input id="username" placeholder="اسم المستخدم"><br>
<input id="pin" placeholder="PIN 4 أرقام" type="password"><br>
<button onclick="login()">دخول</button>
<p id="err" style="color:red"></p>
</div>

<!-- APP -->
<div id="app" class="hidden">

<h2 id="userLabel"></h2>

<select id="day"></select>
<select id="workout"></select>
<select id="status">
<option value="Done">Done</option>
<option value="Light">Light</option>
<option value="Low">Low</option>
<option value="Skip">Skip</option>
</select>

<br>
<button onclick="save()">حفظ</button>

<h3>البيانات:</h3>
<pre id="log"></pre>

<button onclick="logout()">تسجيل خروج</button>

</div>

<script>
// ================= CONFIG =================
const KEY = "app_users";
let currentUser = null;
let data = {};

// ================= LOGIN =================
function login(){
  const u = username.value.trim();
  const p = pin.value.trim();

  if(!u || !/^\d{4}$/.test(p)){
    err.textContent="PIN لازم 4 أرقام";
    return;
  }

  let users = JSON.parse(localStorage.getItem(KEY)||"{}");

  // تسجيل جديد
  if(!users[u]){
    users[u] = { pin:p, data:{} };
    localStorage.setItem(KEY, JSON.stringify(users));
  }

  // تحقق
  if(users[u].pin !== p){
    err.textContent="PIN خطأ";
    return;
  }

  currentUser = u;
  data = users[u].data || {};
  start();
}

// ================= START =================
function start(){
  loginScreen.classList.add("hidden");
  app.classList.remove("hidden");
  userLabel.textContent="👤 "+currentUser;

  day.innerHTML="";
  for(let i=1;i<=90;i++){
    day.innerHTML += `<option>${i}</option>`;
  }

  ["Push","Pull","Legs","Cardio"].forEach(w=>{
    workout.innerHTML += `<option>${w}</option>`;
  });

  render();
}

// ================= SAVE =================
function save(){
  const d = day.value;

  // منع التعديل بعد Done
  if(data[d]?.status === "Done"){
    alert("🚫 لا يمكن تعديل يوم مكتمل");
    return;
  }

  data[d] = {
    workout: workout.value,
    status: status.value
  };

  let users = JSON.parse(localStorage.getItem(KEY));
  users[currentUser].data = data;
  localStorage.setItem(KEY, JSON.stringify(users));

  render();
}

// ================= RENDER =================
function render(){
  log.textContent = JSON.stringify(data,null,2);
}

// ================= LOGOUT =================
function logout(){
  location.reload();
}
</script>

</body>
</html>
