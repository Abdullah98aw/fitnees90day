<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>90 Days Fitness</title>

<style>
:root {
  --bg:#0f1117;
  --card:#1e2335;
  --text:#f5f7fa;
  --muted:#9aa3b2;
  --primary:#3de888;
  --border:rgba(255,255,255,.08);
}

body{
  margin:0;
  font-family:-apple-system,Segoe UI;
  background:var(--bg);
  color:var(--text);
  max-width:420px;
  margin:auto;
  padding:14px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  margin:10px 0;
}

input,select{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#181c27;
  color:#fff;
  margin:6px 0;
}

button{
  width:100%;
  padding:11px;
  border:none;
  border-radius:10px;
  background:var(--primary);
  font-weight:bold;
}

#log p{
  background:#181c27;
  padding:8px;
  border-radius:10px;
  font-size:13px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <h2>تسجيل الدخول</h2>
  <input id="username" placeholder="اكتب اسمك" />
  <button onclick="login()">دخول</button>
</div>

<!-- APP -->
<div id="app" style="display:none">

  <h2 id="user"></h2>

  <!-- WORKOUT -->
  <div class="card">
    <h3 id="day">Day 1</h3>

    <select id="workout">
      <option>Push</option>
      <option>Pull</option>
      <option>Legs</option>
      <option>Walking</option>
      <option>Cardio</option>
    </select>

    <button onclick="save('Done')">Done</button>
    <button onclick="save('Skip')">Skip</button>
  </div>

  <!-- WEIGHT -->
  <div class="card">
    <h3>وزنك</h3>
    <input id="goalWeight" placeholder="الهدف" type="number">
    <input id="currentWeight" placeholder="وزنك الحالي" type="number">
    <button onclick="saveWeight()">حفظ</button>
    <p id="weightInfo"></p>
  </div>

  <!-- SUMMARY -->
  <div class="card">
    <h3>Progress</h3>
    <h2 id="percent">0%</h2>
    <p id="message"></p>
  </div>

  <!-- LOG -->
  <div class="card">
    <h3>السجل</h3>
    <div id="log"></div>
  </div>

  <button onclick="logout()">Logout</button>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbysJDVRV0FeI1kH52WivZ5ogI3P1cWz-AUgOWMdCn6N1TuYDEfJn-RxicF9u0PrY_4y/exec";

const workouts = ["Push","Pull","Legs","Walking","Cardio"];

let user = localStorage.getItem("user");
let data = [];

if(user) startApp();

// LOGIN
function login(){
  const u = username.value.trim();
  if(!u) return alert("اكتب اسمك");
  localStorage.setItem("user",u);
  user=u;
  startApp();
}

// LOGOUT
function logout(){
  localStorage.removeItem("user");
  location.reload();
}

// START
function startApp(){
  login.style.display="none";
  app.style.display="block";
  userLabel();
  load();
}

function userLabel(){
  document.getElementById("user").innerText="👤 "+user;
}

// LOAD
async function load(){
  try{
    const res = await fetch(SCRIPT_URL+"?username="+user+"&t="+Date.now());
    const json = await res.json();
    data = Array.isArray(json)?json:[];
  }catch{
    data=[];
  }
  render();
}

// FIX DAY
function nextDay(){
  if(!data.length) return 1;
  let days = data.map(x=>Number(x.day));
  for(let i=1;i<=90;i++){
    if(!days.includes(i)) return i;
  }
  return 90;
}

// RENDER
function render(){
  log.innerHTML="";
  data.sort((a,b)=>b.day-a.day).forEach(e=>{
    log.innerHTML+=`<p>Day ${e.day} - ${e.workout} - ${e.status}</p>`;
  });

  day.innerText="Day "+nextDay();
  renderSummary();
  renderWeight();
}

// SAVE
async function save(status){
  if(!user) return alert("سجل دخول");

  const workoutVal = workout.value;

  let nextWorkout = workoutVal;
  if(status==="Done"){
    let i=workouts.indexOf(workoutVal);
    nextWorkout=workouts[(i+1)%workouts.length];
  }

  const entry={
    username:user,
    day:nextDay(),
    workout:workoutVal,
    status,
    ts:new Date().toISOString()
  };

  data.push(entry);
  render();

  await fetch(SCRIPT_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(entry)
  });

  workout.value=nextWorkout;
  load();
}

// WEIGHT
function saveWeight(){
  localStorage.setItem("goal_"+user,goalWeight.value);
  localStorage.setItem("current_"+user,currentWeight.value);
  renderWeight();
}

function renderWeight(){
  const goal=localStorage.getItem("goal_"+user);
  const current=localStorage.getItem("current_"+user);

  if(!current){
    weightInfo.innerText="";
    return;
  }

  const remain = goal ? (current-goal).toFixed(1) : "-";

  weightInfo.innerText =
  `الوزن: ${current} | المتبقي: ${remain}`;
}

// SUMMARY (🔥 هذا الي تبيه)
function renderSummary(){
  if(!data.length){
    percent.innerText="0%";
    message.innerText="ابدأ التحدي 💪";
    return;
  }

  let done = data.filter(x=>x.status==="Done").length;
  let total = data.length;

  let p = Math.round((done/total)*100);

  percent.innerText = p + "%";

  if(p>=90) message.innerText="🔥 بطل!";
  else if(p>=70) message.innerText="💪 ممتاز";
  else if(p>=50) message.innerText="👍 جيد";
  else message.innerText="🚀 شد حيلك";
}
</script>

</body>
</html>
